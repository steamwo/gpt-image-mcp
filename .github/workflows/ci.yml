name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Resolve module metadata
        run: |
          go mod tidy
          git diff -- go.mod go.sum
      - run: go test ./...
      - run: go build -trimpath -o gpt-image-mcp .
